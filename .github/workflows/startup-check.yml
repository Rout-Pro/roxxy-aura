name: Startup check (release config + x86_64 ABI, emulator)
on: workflow_dispatch
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Walker unit tests (saved UI dumps, no emulator)
        run: |
          python3 ci/test_walk.py
          python3 ci/e2e_harness_test.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build RELEASE-config validation APK (only difference vs shipped file - extra x86_64 ABI)
        working-directory: aura-android
        env:
          KS_B64: ${{ secrets.ROXXY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ROXXY_KEYSTORE_PASSWORD }}
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a", "armeabi-v7a")/abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")/' app/build.gradle.kts
          grep -n 'abiFilters += listOf' app/build.gradle.kts
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/roxxy.jks"
          { echo "aura.releaseStoreFile=$RUNNER_TEMP/roxxy.jks"; echo "aura.releaseStorePassword=$KS_PASS"; echo "aura.releaseKeyAlias=roxxy"; echo "aura.releaseKeyPassword=$KS_PASS"; } >> local.properties
          chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: ./ci/startup_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: startup-evidence, path: out/* }
