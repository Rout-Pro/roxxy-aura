name: Build Roxxy APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Write signing config
        working-directory: aura-android
        env:
          KS_B64: ${{ secrets.ROXXY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ROXXY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/roxxy.jks"
            {
              echo "aura.releaseStoreFile=$RUNNER_TEMP/roxxy.jks"
              echo "aura.releaseStorePassword=$KS_PASS"
              echo "aura.releaseKeyAlias=roxxy"
              echo "aura.releaseKeyPassword=$KS_PASS"
            } >> local.properties
          fi
      - name: Unit tests
        working-directory: aura-android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build release APK
        working-directory: aura-android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir out
          cp aura-android/app/build/outputs/apk/release/*.apk out/ || true
          ls -la out
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: roxxy-apk, path: out/* }
